<!-- public/chat.html - With unread message notifications -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat - Conversation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .sidebar-header h3 {
            margin-bottom: 5px;
            font-size: 18px;
        }
        .user-list {
            flex: 1;
            overflow-y: auto;
        }
        .user-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .user-item:hover {
            background: #f5f5f5;
        }
        .user-item.active {
            background: #e8eaf6;
            border-left: 4px solid #667eea;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-weight: bold;
            font-size: 15px;
        }
        .unread-badge {
            background: #dc3545;
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 {
            font-size: 20px;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        .message.sent {
            align-items: flex-end;
        }
        .message.received {
            align-items: flex-start;
        }
        .message-bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
            font-size: 16px;
        }
        .message.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .message.received .message-bubble {
            background: white;
            border: 1px solid #e0e0e0;
            color: #333;
        }
        .message-encrypted {
            font-family: monospace;
            font-size: 16px;
            word-break: break-all;
            margin-bottom: 8px;
        }
        .decrypt-btn {
            padding: 6px 14px;
            font-size: 13px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .decrypt-btn:hover {
            background: #f57c00;
        }
        .decrypt-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .plaintext-display {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            font-size: 15px;
            font-weight: 500;
            color: #2e7d32;
            word-break: break-word;
        }
        .message.sent .plaintext-display {
            color: #c8e6c9;
            border-top-color: rgba(255,255,255,0.3);
        }
        .message-meta {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .nav-links {
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-link {
            padding: 8px 15px;
            background: #f0f0f0;
            border-radius: 20px;
            text-decoration: none;
            color: #333;
            font-size: 13px;
            transition: 0.2s;
        }
        .nav-link:hover {
            background: #667eea;
            color: white;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
        }
        .logout-btn:hover {
            background: #c82333;
        }
        .no-user {
            padding: 40px;
            text-align: center;
            color: #999;
            font-size: 16px;
        }
        .notification-dot {
            width: 10px;
            height: 10px;
            background: #dc3545;
            border-radius: 50%;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>🔐 Secure Chat</h3>
            <p id="currentUsername" style="font-size: 13px; opacity: 0.9;"></p>
        </div>
        <div class="user-list" id="userList"></div>
        <div class="nav-links">
            <a href="/processes" class="nav-link">📊 Visualization</a>
            <a href="/bruteforce" class="nav-link">🔓 Brute Force</a>
            <a href="#" id="adminLink" class="nav-link" style="display:none;">⚙️ Admin</a>
            <a href="#" onclick="logout()" class="nav-link logout-btn">🚪 Logout</a>
        </div>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <h3 id="chatWith">Select a user to start chatting</h3>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div class="no-user">👈 Select a user from the sidebar</div>
        </div>
        <div class="input-area" id="inputArea" style="display:none;">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send 🔒</button>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let selectedUserId = null;
        let isAdmin = false;
        // Store decrypted state per message ID
        let decryptedMessages = new Map();
        // Store unread counts per user (userId -> count)
        let unreadCounts = new Map();
        // Store the latest message ID seen per conversation (userId -> maxMessageId)
        let lastSeenMessageId = new Map();
        // Store user list data
        let usersList = [];
        
        async function checkAuth() {
            const response = await fetch('/api/me');
            const data = await response.json();
            if (!data.loggedIn) {
                window.location.href = '/';
                return false;
            }
            document.getElementById('currentUsername').innerText = `Logged in as: ${data.username}`;
            currentUserId = data.userId;
            isAdmin = data.isAdmin;
            if (isAdmin) {
                document.getElementById('adminLink').style.display = 'inline-block';
                document.getElementById('adminLink').href = '/admin';
            }
            return true;
        }
        
        async function loadUsers() {
            const response = await fetch('/api/users');
            usersList = await response.json();
            renderUserList();
        }
        
        function renderUserList() {
            const userListDiv = document.getElementById('userList');
            userListDiv.innerHTML = '';
            usersList.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-item';
                if (selectedUserId === user.id) div.classList.add('active');
                
                const unread = unreadCounts.get(user.id) || 0;
                const unreadHtml = unread > 0 ? `<span class="unread-badge">${unread}</span>` : '';
                
                div.innerHTML = `
                    <div class="user-avatar">${user.username.charAt(0).toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">${escapeHtml(user.username)}</div>
                    </div>
                    ${unreadHtml}
                `;
                div.onclick = () => selectUser(user.id, user.username);
                userListDiv.appendChild(div);
            });
        }
        
        async function selectUser(userId, username) {
            // Clear unread count for this user when opening chat
            if (unreadCounts.has(userId)) {
                unreadCounts.delete(userId);
                renderUserList();
            }
            selectedUserId = userId;
            document.getElementById('chatWith').innerHTML = `Chat with ${username}`;
            document.getElementById('inputArea').style.display = 'flex';
            await loadMessages();
            renderUserList();
        }
        
        async function loadMessages() {
            if (!selectedUserId) return;
            const response = await fetch(`/api/messages/${selectedUserId}`);
            const messages = await response.json();
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            // Find the highest message ID in this conversation
            let maxId = 0;
            for (const msg of messages) {
                if (msg.id > maxId) maxId = msg.id;
            }
            const previousLastSeen = lastSeenMessageId.get(selectedUserId) || 0;
            // Update last seen to current max
            lastSeenMessageId.set(selectedUserId, maxId);
            
            for (const msg of messages) {
                const isSent = msg.sender_id === currentUserId;
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                
                const decryptedText = decryptedMessages.get(msg.id);
                const plainHtml = decryptedText ? 
                    `<div class="plaintext-display">📄 Decrypted: "${escapeHtml(decryptedText)}"</div>` : '';
                
                messageDiv.innerHTML = `
                    <div class="message-bubble">
                        <div class="message-encrypted">🔒 ${escapeHtml(msg.cipher_text)}</div>
                        <button class="decrypt-btn" data-message-id="${msg.id}" ${decryptedText ? 'disabled' : ''}>
                            ${decryptedText ? 'Decrypted' : 'Decrypt'}
                        </button>
                        ${plainHtml}
                        <div class="message-meta">${msg.sender_name} • ${new Date(msg.timestamp).toLocaleTimeString()}</div>
                    </div>
                `;
                container.appendChild(messageDiv);
            }
            
            // Attach event listeners to all decrypt buttons
            document.querySelectorAll('.decrypt-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const messageId = parseInt(btn.getAttribute('data-message-id'));
                    if (decryptedMessages.has(messageId)) return;
                    await decryptMessage(messageId, btn);
                });
            });
            
            container.scrollTop = container.scrollHeight;
        }
        
        async function decryptMessage(messageId, btnElement) {
            const response = await fetch('/api/decrypt-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messageId })
            });
            const data = await response.json();
            if (data.plaintext) {
                decryptedMessages.set(messageId, data.plaintext);
                await loadMessages();
            } else {
                alert('Failed to decrypt message');
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const plaintext = input.value.trim();
            if (!plaintext || !selectedUserId) return;
            
            const response = await fetch('/api/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ receiverId: selectedUserId, plaintext })
            });
            const data = await response.json();
            if (data.success) {
                input.value = '';
                await loadMessages();
                // After sending, update last seen for this conversation to include our sent message
                // The loadMessages will update lastSeenMessageId
            } else {
                alert('Failed to send message');
            }
        }
        
        // Check for new messages across all conversations and update unread counts
        async function checkForNewMessages() {
            if (!currentUserId) return;
            
            // For each user, fetch the latest messages and see if there are any new ones (where id > lastSeen)
            for (const user of usersList) {
                const userId = user.id;
                // Skip if we're currently viewing this conversation - we'll mark as read automatically
                if (selectedUserId === userId) continue;
                
                const response = await fetch(`/api/messages/${userId}`);
                const messages = await response.json();
                if (messages.length === 0) continue;
                
                const maxId = Math.max(...messages.map(m => m.id));
                const lastSeen = lastSeenMessageId.get(userId) || 0;
                
                if (maxId > lastSeen) {
                    // Count how many new messages (with id > lastSeen) and are NOT sent by current user
                    const newMessages = messages.filter(m => m.id > lastSeen && m.sender_id !== currentUserId);
                    const newCount = newMessages.length;
                    if (newCount > 0) {
                        const currentUnread = unreadCounts.get(userId) || 0;
                        unreadCounts.set(userId, currentUnread + newCount);
                    }
                    // Update last seen to maxId to avoid counting same messages again
                    lastSeenMessageId.set(userId, maxId);
                }
            }
            renderUserList();
            
            // Also play a sound or show browser notification if there are any unread messages?
            // Optional: simple console log or title flash
            const totalUnread = Array.from(unreadCounts.values()).reduce((a,b) => a+b, 0);
            if (totalUnread > 0) {
                document.title = `(${totalUnread}) Secure Chat`;
                // Optional: flash favicon? Not needed.
            } else {
                document.title = `Secure Chat`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }
        
        async function init() {
            const auth = await checkAuth();
            if (!auth) return;
            await loadUsers();
            // Initial check for unread messages
            await checkForNewMessages();
            // Refresh messages every 3 seconds for current conversation
            setInterval(async () => {
                if (selectedUserId) {
                    // Before loading messages, check if there are new messages from others
                    await checkForNewMessages();
                    await loadMessages();
                    // After loading, clear unread for this conversation if any
                    if (unreadCounts.has(selectedUserId)) {
                        unreadCounts.delete(selectedUserId);
                        renderUserList();
                    }
                } else {
                    await checkForNewMessages();
                }
            }, 3000);
        }
        
        init();
    </script>
</body>
</html>
